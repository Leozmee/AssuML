{# Usage: {% include 'components/badge.html' with decision=decision %} #}
{% if decision == 'accepter' %}
  <span class="badge badge-accepter px-3 py-2 rounded-pill">✅ Accepter</span>
{% elif decision == 'examiner' %}
  <span class="badge badge-examiner px-3 py-2 rounded-pill">⚠️ Examiner</span>
{% elif decision == 'refuser' %}
  <span class="badge badge-refuser px-3 py-2 rounded-pill">❌ Refuser</span>
{% else %}
  <span class="badge bg-secondary px-3 py-2 rounded-pill">{{ decision }}</span>
{% endif %}
