{# Usage: {% include 'components/kpi_card.html' with label="KPI" value="42" color="accent" %} #}
<div class="kpi-card h-100" style="{% if color %}border-left-color: var(--{{ color }});{% endif %}">
  <div class="kpi-value">{{ value }}</div>
  <div class="kpi-label">{{ label }}</div>
  {% if sublabel %}<div class="text-muted small mt-1">{{ sublabel }}</div>{% endif %}
</div>
