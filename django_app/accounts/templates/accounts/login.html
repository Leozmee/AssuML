{% extends 'base.html' %}

{% block title %}Connexion{% endblock %}

{% block main_content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header text-center py-4" style="background: #1f4e79; color: white;">
        <h2 class="mb-0 fs-4 fw-bold">AssuML</h2>
        <small class="opacity-75">Assurance intelligente</small>
      </div>
      <div class="card-body p-4">
        <h3 class="fs-5 mb-4 text-center">Connexion</h3>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">{{ form.email.label }}</label>
            {{ form.email }}
          </div>
          <div class="mb-4">
            <label class="form-label">{{ form.password.label }}</label>
            {{ form.password }}
          </div>
          <button type="submit" class="btn btn-primary w-100">Se connecter</button>
        </form>
      </div>
      <div class="card-footer text-center py-3">
        <small>Pas encore de compte ?
          <a href="{% url 'accounts:register' %}">Créer un compte</a>
        </small>
      </div>
    </div>
  </div>
</div>
{% endblock main_content %}
