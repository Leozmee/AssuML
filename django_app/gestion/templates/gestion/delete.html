{% extends 'base.html' %}

{% block title %}Supprimer client {{ client_id }}{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Supprimer client {{ client_id }}</h1>
</div>

<div class="row">
  <div class="col-md-5">
    <div class="card border-danger">
      <div class="card-body">
        <p class="mb-4">
          Êtes-vous sûr de vouloir supprimer le client <strong>{{ client_id }}</strong> ?
          <br><span class="text-muted small">Cette action est réversible (suppression logique).</span>
        </p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Confirmer la suppression</button>
            <a href="{% url 'gestion:detail' client_id %}" class="btn btn-outline-secondary">Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
