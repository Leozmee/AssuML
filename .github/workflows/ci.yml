name: CI

# Déclencheurs : à chaque push (toutes branches) et sur les PR vers main
# (cf. specs/010-cicd-github-actions/research.md, décision 7)
on:
  push:
  pull_request:
    branches: [main]

# Annule les exécutions obsolètes lors de pushs successifs rapprochés
# sur la même branche (économise les minutes CI)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1 — Qualité : Black (formatage) + Flake8 (lint)
  # Reproduit les mêmes contrôles que le hook pre-commit local,
  # mais en mode "vérification" uniquement (--check, pas de reformatage).
  # ──────────────────────────────────────────────────────────────
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Black (vérification du formatage)
        run: black --check .

      - name: Flake8 (lint)
        run: flake8 --max-line-length=88

  # ──────────────────────────────────────────────────────────────
  # Job 2 — Tests unitaires et de contrat (sans base de données réelle)
  # tests/unit et tests/contract utilisent SQLite in-memory / mocks.
  # ──────────────────────────────────────────────────────────────
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Les modèles .pkl sont gitignored (cf. constitution Principe IV) mais
      # data/processed/features.csv est commité : on entraîne donc les deux
      # modèles à partir de ce fichier pour que predict_cost()/predict_risk()
      # (et le endpoint /health en intégration) disposent d'un .pkl valide.
      - name: Entraîner les modèles ML (régression + classification)
        run: |
          python -m ml_models.training.train_regression
          python -m ml_models.training.train_classification

      - name: Pytest (unitaires + contrats)
        run: pytest -m "not integration" -v

  # ──────────────────────────────────────────────────────────────
  # Job 3 — Tests d'intégration avec un vrai PostgreSQL
  # Démarre un service container Postgres éphémère, charge le schéma
  # (database/schema.sql contient déjà les INSERT de seed pour regions),
  # puis exécute les tests marqués @pytest.mark.integration.
  # ──────────────────────────────────────────────────────────────
  tests-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: assuml_user
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: assuml_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # /health exige que les deux modèles soient chargés (sinon 503), et le
      # script attend une réponse 200 avant de lancer les tests d'intégration.
      - name: Entraîner les modèles ML (régression + classification)
        run: |
          python -m ml_models.training.train_regression
          python -m ml_models.training.train_classification

      - name: Installer le client PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Charger le schéma
        env:
          PGPASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: psql -h localhost -U assuml_user -d assuml_db -f database/schema.sql

      # Peuple la BDD avec les 1 338 clients depuis insurance.csv (commité).
      # Remplace les 3 clients de test qui étaient dans schema.sql.
      - name: Peupler la BDD (seed clients)
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: assuml_user
          DB_PASS: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: assuml_db
        run: python database/seed.py

      # Les tests tests/contract/ sont marqués @pytest.mark.integration et
      # interrogent l'API réelle en HTTP (httpx) sur localhost:8000 — il faut
      # donc démarrer uvicorn avant de lancer pytest -m integration.
      - name: Démarrer l'API FastAPI en arrière-plan
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: assuml_user
          DB_PASS: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: assuml_db
          API_KEY: ${{ secrets.CI_API_KEY }}
        run: |
          nohup uvicorn api.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API prête."
              exit 0
            fi
            sleep 1
          done
          echo "L'API n'a pas démarré à temps — logs uvicorn :"
          cat uvicorn.log
          exit 1

      - name: Pytest (intégration)
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: assuml_user
          DB_PASS: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: assuml_db
          API_KEY: ${{ secrets.CI_API_KEY }}
        run: pytest -m integration -v

  # ──────────────────────────────────────────────────────────────
  # Job 4 — Tests Django (django_app/tests/) avec un vrai PostgreSQL
  # django_app a ses propres dépendances (django_app/requirements.txt) et
  # son propre pytest.ini (DJANGO_SETTINGS_MODULE = config.settings).
  # pytest-django crée sa propre base éphémère "test_assuml_db" via
  # `CREATE DATABASE` puis y rejoue les migrations Django de l'app
  # accounts (les tables métier gérées par SQLAlchemy — clients, regions...
  # — ne sont pas nécessaires ici : les tests mockent l'API FastAPI).
  # Le POSTGRES_USER de l'image officielle postgres est superuser sur
  # l'instance, donc CREATEDB est déjà accordé (contrairement à un
  # assuml_user provisionné manuellement en local).
  # ──────────────────────────────────────────────────────────────
  tests-django:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: assuml_user
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: assuml_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: django_app/requirements.txt

      - name: Installer les dépendances Django
        run: pip install -r django_app/requirements.txt

      - name: Pytest (django_app)
        working-directory: django_app
        env:
          # Valeur factice : uniquement nécessaire pour que settings.py se
          # charge (os.environ["DJANGO_SECRET_KEY"], strict) — pas besoin
          # d'un vrai secret pour lancer des tests (même logique que le
          # job docker-build ci-dessous).
          DJANGO_SECRET_KEY: dummy_secret_ci
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: assuml_user
          DB_PASS: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: assuml_db
          API_KEY: ${{ secrets.CI_API_KEY }}
        run: pytest tests/ -v

  # ──────────────────────────────────────────────────────────────
  # Job 5 — Docker : vérifie que les images du projet construisent
  # toujours, et que docker-compose.yml reste syntaxiquement valide.
  # Ne démarre pas les conteneurs (pas de docker compose up) : ce job
  # attrape les régressions de build (Dockerfile cassé, requirements
  # manquants...), pas les régressions de comportement à l'exécution.
  # ──────────────────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image principale (api / seed / streamlit / etl_scheduler)
        run: docker build -t assuml-api-test .

      - name: Build de l'image Django
        run: docker build -f django_app/Dockerfile -t assuml-django-test .

      - name: Valider la syntaxe de docker-compose.yml
        env:
          DB_USER: assuml_user
          DB_PASS: dummy_password
          DB_NAME: assuml_db
          API_KEY: dummy_key
          DJANGO_SECRET_KEY: dummy_secret
          OPENWEATHER_API_KEY: dummy_key
        run: docker compose config --quiet
